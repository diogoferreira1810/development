name: Basic CI Pipeline

# This is a basic CI pipeline to get you started with GitHub Actions
# It runs on push and pull request events

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Explicitly set minimal permissions for security
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linter (flake8)
      run: |
        flake8 app.py test_app.py --max-line-length=100 --statistics
    
    - name: Run tests
      run: |
        pytest test_app.py -v
    
    - name: Run application
      run: |
        python app.py
